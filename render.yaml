services:
  - type: web
    name: leafguard77
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LEAFGUARD_GRADCAM
        value: "true"
      - key: LEAFGUARD_SEMANTIC_GATE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: leafguard-db
          property: connectionString

databases:
  - name: leafguard-db
    plan: free
